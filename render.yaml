services:
  - type: web
    name: solenne
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install && npm run build && npx prisma generate && npx prisma db push && node prisma/seed.js
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: "22"
